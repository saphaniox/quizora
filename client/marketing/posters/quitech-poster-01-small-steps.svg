<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Quitech poster: Small steps. Real progress.</title>
  <desc id="desc">A warm, encouraging study poster inviting learners to start with one focused quiz round at quitech.online.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#111827" opacity=".09"/>
    </pattern>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf2"/>
      <stop offset="1" stop-color="#f4eee4"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#wash)"/>
  <circle cx="965" cy="310" r="190" fill="#f5d7cb"/>
  <circle cx="965" cy="310" r="190" fill="url(#dots)"/>
  <circle cx="1000" cy="1120" r="205" fill="#e8eee7"/>
  <circle cx="1000" cy="1120" r="205" fill="url(#dots)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="86" y="104" fill="#111827" font-size="38" font-weight="800" letter-spacing="1">QUI<tspan fill="#ef4444">TECH</tspan></text>
    <rect x="86" y="130" width="78" height="7" rx="3.5" fill="#ef4444"/>
    <text x="86" y="195" fill="#576174" font-size="21" font-weight="700" letter-spacing="4">A LITTLE PRACTICE GOES A LONG WAY</text>

    <text x="82" y="355" fill="#111827" font-size="94" font-weight="800" letter-spacing="-4">SMALL STEPS.</text>
    <text x="82" y="461" fill="#ef4444" font-size="94" font-weight="800" letter-spacing="-4">REAL PROGRESS.</text>
    <text x="88" y="526" fill="#465064" font-size="30">No perfect routine required.</text>
    <text x="88" y="570" fill="#465064" font-size="30">Start with one focused quiz round.</text>

    <rect x="86" y="650" width="908" height="305" rx="28" fill="#fff" stroke="#e2ddd5" stroke-width="2"/>
    <text x="124" y="710" fill="#657083" font-size="19" font-weight="700" letter-spacing="3">MAKE TODAY'S NEXT STEP YOURS</text>
    <g>
      <circle cx="157" cy="785" r="24" fill="#ef4444"/>
      <text x="157" y="793" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">1</text>
      <text x="204" y="795" fill="#111827" font-size="28" font-weight="700">Pick a topic that matters to you</text>
      <circle cx="157" cy="855" r="24" fill="#111827"/>
      <text x="157" y="863" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">2</text>
      <text x="204" y="865" fill="#111827" font-size="28" font-weight="700">Try a round. Learn as you go.</text>
      <path d="M157 809v21" stroke="#d8d5cf" stroke-width="3" stroke-linecap="round"/>
    </g>

    <rect x="86" y="1000" width="908" height="154" rx="24" fill="#111827"/>
    <text x="126" y="1060" fill="#c9d0dc" font-size="20" font-weight="700" letter-spacing="2">YOUR NEXT QUIZ IS WAITING</text>
    <text x="126" y="1114" fill="#fff" font-size="38" font-weight="800">quitech.online</text>
    <circle cx="916" cy="1077" r="40" fill="#ef4444"/>
    <path d="M900 1077h31m-12-12 12 12-12 12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="88" y="1230" fill="#5b6472" font-size="21" font-weight="700">Learn at your pace · Learners 13+</text>
    <text x="88" y="1274" fill="#8a8f98" font-size="18">Quitech — Learn, challenge &amp; progress.</text>
  </g>
</svg>
