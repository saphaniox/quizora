<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quitech</title>
    <style>
      body {
        align-items: center;
        background: #fbfcf8;
        color: #0f172a;
        display: flex;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }

      main {
        max-width: 360px;
      }

      img {
        border-radius: 14px;
        height: 72px;
        width: 72px;
      }

      h1 {
        font-size: 28px;
        margin: 18px 0 8px;
      }

      p {
        color: #64748b;
        font-size: 15px;
        line-height: 1.6;
        margin: 0 0 20px;
      }

      a {
        background: #2563eb;
        border-radius: 8px;
        color: white;
        display: inline-block;
        font-size: 14px;
        font-weight: 700;
        padding: 12px 16px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./logo.png" alt="Quitech logo" />
      <h1>Quitech</h1>
      <p>Connect to the internet to continue learning, challenging yourself, and tracking progress.</p>
      <a href="https://quitech.online">Open Quitech</a>
    </main>
  </body>
</html>
